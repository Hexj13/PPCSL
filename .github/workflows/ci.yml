name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kupito
          POSTGRES_PASSWORD: kupito123
          POSTGRES_DB: kupito_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kupito"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          until pg_isready -h localhost -p 5432 -U kupito; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Run linter
        working-directory: ./backend
        run: npm run lint:check

      - name: Check formatting (backend)
        working-directory: ./backend
        run: npm run format:check

      - name: Run tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: kupito
          DB_PASSWORD: kupito123
          DB_NAME: kupito_test
          JWT_SECRET: test-secret-key
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm test

      - name: Run integration tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: kupito
          DB_PASSWORD: kupito123
          DB_NAME: kupito_test
          JWT_SECRET: test-secret-key
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: timeout 300 npm run test:integration
        continue-on-error: false

  frontend-test:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linter
        working-directory: ./frontend
        run: npm run lint

      - name: Run style linter
        working-directory: ./frontend
        run: npm run lint:styles

      - name: Check formatting
        working-directory: ./frontend
        run: npm run format:check

      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --passWithNoTests

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: TypeScript check (frontend)
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: TypeScript check (backend)
        working-directory: ./backend
        run: npx tsc --noEmit

  sync-to-locales:
    name: Sync to Locale Repositories (PR)
    runs-on: ubuntu-latest
    needs: [typecheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open submodule update PR in kupito.club
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          CORE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "PAT_TOKEN secret not set. Skipping submodule update."
            echo "To enable automatic submodule updates, add a Personal Access Token (PAT) with repo + workflow scope to repository secrets as PAT_TOKEN"
            exit 0
          fi

          CREDENTIAL_FILE=$(mktemp)
          echo "https://x-access-token:${PAT_TOKEN}@github.com" > "$CREDENTIAL_FILE"
          git config --global credential.helper "store --file=$CREDENTIAL_FILE"

          cleanup() {
            rm -f "$CREDENTIAL_FILE"
            git config --global --unset credential.helper 2>/dev/null || true
          }
          trap cleanup EXIT

          SHORT_SHA=$(echo "$CORE_SHA" | cut -c1-7)
          BRANCH="chore/update-core-${SHORT_SHA}"

          git clone https://github.com/Hexj13/kupito.club.git ../kupito.club
          cd ../kupito.club
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git submodule update --init --recursive

          cd core
          PREV_SHA=$(git rev-parse HEAD)
          git fetch origin
          git checkout "$CORE_SHA"
          CHANGELOG=$(git log --oneline "${PREV_SHA}..${CORE_SHA}" || echo "- $CORE_SHA")
          cd ..

          if git diff --quiet core; then
            echo "No submodule changes to propose."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add core
          git commit -m "chore: update PPCSL core to ${SHORT_SHA}"
          git push origin "$BRANCH"

          PR_BODY=$(printf '## Update PPCSL core to %s\n\nAuto-generated by PPCSL CI after merge to core main.\n\n### Changes in core\n\n```\n%s\n```\n\nMerge after CI checks pass.\n' "$SHORT_SHA" "$CHANGELOG")

          # Open PR via GitHub API
          curl -fsS -X POST \
            -H "Authorization: Bearer $PAT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Hexj13/kupito.club/pulls \
            -d "$(jq -nc --arg title "chore: update PPCSL core to ${SHORT_SHA}" \
                         --arg head "$BRANCH" \
                         --arg base "main" \
                         --arg body "$PR_BODY" \
                         '{title: $title, head: $head, base: $base, body: $body}')" \
            || echo "PR creation failed (branch may already have an open PR)"

          cleanup

      # Add new platforms here by duplicating the step above and changing
      # the repository URL + PR title/body to match the platform.
